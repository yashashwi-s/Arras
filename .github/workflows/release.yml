name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    # The settings-window appearance is linked-SDK dependent. Use the SDK that
    # produces the UI shipped in the reference build instead of macos-15's
    # legacy SwiftUI tab presentation.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Verify SDK
        run: |
          xcodebuild -version
          test "$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)" = "27"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Verify Tag and Test
        run: |
          set -euo pipefail
          VERSION="$(xcodebuild -project Arras.xcodeproj -scheme Arras -showBuildSettings | awk '/MARKETING_VERSION/ { print $3; exit }')"
          test "v${VERSION}" = "$GITHUB_REF_NAME"
          xcodebuild \
            -project Arras.xcodeproj \
            -scheme Arras \
            -configuration Debug \
            -destination 'platform=macOS' \
            test

      - name: Build Release
        run: |
          xcodebuild \
            -project Arras.xcodeproj \
            -scheme Arras \
            -configuration Release \
            CONFIGURATION_BUILD_DIR=build/Release \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            build

      - name: Validate Build
        run: |
          APP_PATH="build/Release/Arras.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ Arras.app not found"
            exit 1
          fi
          SIZE=$(du -sm "$APP_PATH" | cut -f1)
          echo "✅ Arras.app size: ${SIZE}MB"
          if [ "$SIZE" -lt 1 ]; then
            echo "❌ Build output too small"
            exit 1
          fi

      - name: Package Zip
        run: |
          cd build/Release
          ditto -c -k --sequesterRsrc --keepParent Arras.app Arras.app.zip

      - name: Package DMG
        run: |
          # A staging folder with an /Applications symlink, so the disk image is a real
          # drag-to-install rather than a window containing one loose .app. Running the app
          # straight off the mounted image is what leaves it unable to update itself.
          STAGE=build/dmg
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp -R build/Release/Arras.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"

          hdiutil create \
            -volname "Arras" \
            -srcfolder "$STAGE" \
            -ov -format UDZO \
            build/Release/Arras.dmg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Arras ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build/Release/Arras.app.zip
            build/Release/Arras.dmg

      # The checksum must come from the artifact this job just uploaded, never
      # from a local build.
      #
      # This workflow rebuilds the app on its own runner and overwrites whatever
      # was attached to the release, so a checksum computed on a developer's Mac
      # describes a different binary. The in-app updater refuses any download
      # that doesn't match, which silently broke every update until the appcast
      # was stamped here instead.
      - name: Stamp appcast with the published checksum
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(shasum -a 256 build/Release/Arras.app.zip | cut -d' ' -f1)
          echo "Publishing $VERSION with sha256 $SHA"

          git fetch origin main
          git checkout main

          python3 - "$VERSION" "$SHA" "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" <<'PY'
          import json, pathlib, sys
          version, sha, tag, repo = sys.argv[1:5]
          path = pathlib.Path("appcast.json")
          data = json.loads(path.read_text())
          data["latestVersion"] = version
          data["downloadURL"] = f"https://github.com/{repo}/releases/download/{tag}/Arras.app.zip"
          data["sha256"] = sha
          # releaseNotes is written by a human before tagging; leave it alone.
          path.write_text(json.dumps(data, indent=2) + "\n")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.json
          git diff --staged --quiet || git commit -m "chore: appcast checksum for ${GITHUB_REF_NAME} [skip ci]"
          git push origin main
