name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    # SwiftUI's native settings tabs are linked-SDK dependent. The reference UI
    # is the macOS 27 presentation, so CI must exercise the same SDK as release.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Verify SDK
        run: |
          xcodebuild -version
          test "$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)" = "27"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Verify Generated Project Is Current
        run: git diff --exit-code -- Arras.xcodeproj

      - name: Validate Documentation
        run: |
          set -euo pipefail
          README_LINES="$(wc -l < README.md | tr -d ' ')"
          if [ "$README_LINES" -gt 200 ]; then
            echo "README.md has ${README_LINES} lines; the project limit is 200."
            exit 1
          fi
          test -f FEATURES.md
          test -f ARCHITECTURE.md
          test -f CHANGELOG.md
          test -f scripts/validate_release_notes.py
          PROJECT_VERSION="$(awk '/MARKETING_VERSION:/ { print $2; exit }' project.yml)"
          python3 scripts/validate_release_notes.py \
            --version "$PROJECT_VERSION" \
            --all

      - name: Test
        run: |
          xcodebuild \
            -project Arras.xcodeproj \
            -scheme Arras \
            -configuration Debug \
            -destination 'platform=macOS' \
            test

      - name: Build
        run: |
          xcodebuild \
            -project Arras.xcodeproj \
            -scheme Arras \
            -configuration Release \
            CONFIGURATION_BUILD_DIR=build/Release \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            build

      - name: Validate Build
        run: |
          APP_PATH="build/Release/Arras.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ Arras.app not found"
            exit 1
          fi
          SIZE=$(du -sm "$APP_PATH" | cut -f1)
          echo "✅ Arras.app size: ${SIZE}MB"
          if [ "$SIZE" -lt 1 ]; then
            echo "❌ Build output too small (${SIZE}MB)"
            exit 1
          fi
