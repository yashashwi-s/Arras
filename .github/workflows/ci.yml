name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  documentation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Documentation
        run: |
          set -euo pipefail
          PROJECT_VERSION="$(awk '/MARKETING_VERSION:/ { print $2; exit }' project.yml)"
          python3 scripts/validate_product_metadata.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/validate_release_notes.py \
            --version "$PROJECT_VERSION" \
            --all

      - name: Require documentation declaration for behavior changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          CHANGED_FILES="$RUNNER_TEMP/arras-changed-files.txt"
          PR_BODY_FILE="$RUNNER_TEMP/arras-pr-body.md"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$CHANGED_FILES"
          printf '%s' "$PR_BODY" > "$PR_BODY_FILE"
          python3 scripts/validate_pr_documentation.py \
            --changed-files "$CHANGED_FILES" \
            --pr-body-file "$PR_BODY_FILE"


  build:
    name: ${{ matrix.distribution }} validation
    # One target's UI failure must not suppress the other target's build evidence.
    strategy:
      fail-fast: false
      matrix:
        distribution: [direct, app-store]
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Verify SDK
        run: |
          xcodebuild -version
          test "$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)" = "27"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Verify Generated Project Is Current
        run: git diff --exit-code -- Arras.xcodeproj

      - name: Test updater replacement and rollback
        if: matrix.distribution == 'direct'
        run: python3 -m unittest discover -s scripts -p 'test_updater_rollback.py'

      - name: Test direct target
        if: matrix.distribution == 'direct'
        run: |
          xcodebuild \
            -project Arras.xcodeproj \
            -scheme Arras \
            -configuration Debug \
            -destination 'platform=macOS' \
            -resultBundlePath "$RUNNER_TEMP/Arras-CI.xcresult" \
            test

      - name: Test sandboxed App Store target
        if: matrix.distribution == 'app-store'
        run: |
          xcodebuild \
            -project Arras.xcodeproj \
            -scheme ArrasAppStore \
            -configuration Debug \
            -destination 'platform=macOS' \
            -only-testing:ArrasAppStoreTests \
            -derivedDataPath "$RUNNER_TEMP/arras-app-store-tests" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM='' \
            test

      - name: Preserve direct UI test diagnostics
        if: always() && matrix.distribution == 'direct'
        uses: actions/upload-artifact@v4
        with:
          name: arras-native-results-${{ github.run_id }}
          path: ${{ runner.temp }}/Arras-CI.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Build and validate direct target
        if: matrix.distribution == 'direct'
        run: ./build.sh

      - name: Build and validate sandboxed App Store target
        if: matrix.distribution == 'app-store'
        run: ./build.sh --app-store
        # Never upload this target to GitHub Releases or public build artifacts.
