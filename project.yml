name: Tableau
options:
  bundleIdPrefix: com.yashashwi
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

# Both distribution channels build the exact same sources. They differ only in
# entitlements and in whether the self-updater is compiled in — App Store Review
# Guideline 2.4.5(iv) requires App Store builds to update via the App Store.
targetTemplates:
  TableauApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
        excludes:
          - "*.entitlements"
    settings:
      base:
        PRODUCT_NAME: "Tableau"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.photography"
        INFOPLIST_KEY_CFBundleDisplayName: "Tableau"
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 5
        MARKETING_VERSION: 2.1.0
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Tableau needs access to your Photos library so you can pick images to display on your desktop."
        ENABLE_HARDENED_RUNTIME: YES

targets:
  # Developer ID / direct download build. Includes the appcast update checker.
  Tableau:
    templates: [TableauApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yashashwi.tableau
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: Sources/App/PhotoWidgetOSX.entitlements
        DEVELOPMENT_TEAM: ""
      configs:
        # Xcode injects get-task-allow (a debug entitlement) unless told not to.
        # Notarization rejects any binary that carries it.
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  # Mac App Store build. Same features minus the self-updater.
  Tableau-MAS:
    templates: [TableauApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yashashwi.tableau
        CODE_SIGN_ENTITLEMENTS: Sources/App/Tableau-MAS.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: MAS
        # Switch to "3rd Party Mac Developer Application" and set DEVELOPMENT_TEAM
        # once a paid account is attached; ad-hoc keeps local builds working.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
      configs:
        # get-task-allow is a debug entitlement; App Store submission rejects any
        # binary carrying it, exactly as notarization does for Developer ID.
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
