name: Arras
options:
  bundleIdPrefix: com.yashashwi
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targetTemplates:
  ArrasApp:
    type: application
    platform: macOS
    settings:
      base:
        PRODUCT_NAME: "Arras"
        PRODUCT_MODULE_NAME: Arras
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.photography"
        INFOPLIST_KEY_CFBundleDisplayName: "Arras"
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 2209
        MARKETING_VERSION: 2.5.0
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Arras needs access to your Photos library so you can pick images to display on your desktop."
        ENABLE_HARDENED_RUNTIME: YES
    preBuildScripts:
      - name: Capture application source
        script: python3 "$SRCROOT/scripts/build_provenance.py" prepare
        basedOnDependencyAnalysis: false
        showEnvVars: false
        outputFiles:
          - $(DERIVED_FILE_DIR)/ArrasSourceSnapshot.json
    postBuildScripts:
      - name: Verify and stamp application source
        script: python3 "$SRCROOT/scripts/build_provenance.py" stamp
        basedOnDependencyAnalysis: false
        showEnvVars: false
        inputFiles:
          - $(DERIVED_FILE_DIR)/ArrasSourceSnapshot.json
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ArrasBuildProvenance.json
    info:
      path: Info.generated.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Arras
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.photography
        NSPhotoLibraryUsageDescription: "Arras needs access to your Photos library so you can pick images to display on your desktop."
        CFBundleDocumentTypes:
          - CFBundleTypeExtensions:
              - arras
              - tableau
            CFBundleTypeName: Arras Layout
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.yashashwi.arras.layout
        UTExportedTypeDeclarations:
          - UTTypeConformsTo:
              - public.data
            UTTypeDescription: Arras Layout
            UTTypeIdentifier: com.yashashwi.arras.layout
            UTTypeTagSpecification:
              public.filename-extension:
                - arras
                - tableau

targets:
  Arras:
    templates: [ArrasApp]
    sources:
      - path: Sources/App
        excludes: ["*.entitlements"]
    info:
      properties:
        ArrasAppStoreBuild: false
        ArrasPrivateTelemetryPilot: false
        ArrasTelemetryEnabled: true
        ArrasTelemetryReportingDays: 7
        ArrasTelemetryURL: https://tryarras.tech/api/telemetry/v1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yashashwi.tableau
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: Sources/App/PhotoWidgetOSX.entitlements
        DEVELOPMENT_TEAM: ""
      configs:
        # Xcode injects get-task-allow (a debug entitlement) unless told not to.
        # Notarization rejects any binary that carries it.
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          CLANG_ENABLE_CODE_COVERAGE: NO

  ArrasAppStore:
    templates: [ArrasApp]
    sources:
      - path: Sources/App
        excludes:
          - "*.entitlements"
          - Updater.swift
          - DownloadTask.swift
          - InstallLocation.swift
          - StorageMigration.swift
          - Telemetry.swift
          - TelemetryRuntime.swift
      - path: Sources/AppStore
        excludes: ["*.entitlements", Info.plist]
    info:
      path: Sources/AppStore/Info.plist
      properties:
        ArrasAppStoreBuild: true
        ArrasPrivateTelemetryPilot: false
        ArrasTelemetryEnabled: false
        NSScreenCaptureUsageDescription: "Arras captures only the screen region you select to create a desktop widget."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yashashwi.arras.appstore
        CONFIGURATION_BUILD_DIR: "$(BUILD_DIR)/AppStore/$(CONFIGURATION)"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ARRAS_APP_STORE"
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: K28DKAV937
        CODE_SIGN_ENTITLEMENTS: Sources/AppStore/ArrasAppStore.entitlements
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.yashashwi.arras.appstore.development
          PRODUCT_NAME: "Arras App Store Dev"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG ARRAS_APP_STORE"
          CODE_SIGN_ENTITLEMENTS: Sources/AppStore/ArrasAppStore.debug.entitlements
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          CLANG_ENABLE_CODE_COVERAGE: NO

  ArrasTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/Unit
    dependencies:
      - target: Arras
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yashashwi.tableau.tests
        GENERATE_INFOPLIST_FILE: YES

  ArrasUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/UI
    dependencies:
      - target: Arras
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yashashwi.tableau.uitests
        GENERATE_INFOPLIST_FILE: YES

  ArrasAppStoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/Unit
        excludes: [UpdaterTests.swift, TelemetryTests.swift]
      - path: Tests/AppStore/SandboxMigrationTests.swift
    dependencies:
      - target: ArrasAppStore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yashashwi.arras.appstore.tests
        CONFIGURATION_BUILD_DIR: "$(BUILD_DIR)/AppStore/$(CONFIGURATION)"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ARRAS_APP_STORE"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILD_DIR)/AppStore/$(CONFIGURATION)/Arras.app/Contents/MacOS/Arras"
      configs:
        Debug:
          TEST_HOST: "$(BUILD_DIR)/AppStore/$(CONFIGURATION)/Arras App Store Dev.app/Contents/MacOS/Arras App Store Dev"

  ArrasAppStoreUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/UI
        excludes: ["*.entitlements"]
    dependencies:
      - target: ArrasAppStore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yashashwi.arras.appstore.uitests
        CONFIGURATION_BUILD_DIR: "$(BUILD_DIR)/AppStore/$(CONFIGURATION)"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ARRAS_APP_STORE"
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Tests/AppStore/UITests.entitlements

schemes:
  Arras:
    build:
      targets:
        Arras: all
        ArrasTests: [test]
        ArrasUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      environmentVariables:
        ARRAS_UNIT_TESTING: "1"
      # Window fixtures must not inherit the user's live hiding preferences.
      # These command-line defaults exist only in the test host process.
      commandLineArguments:
        "-presence.autoHideForConferencingApps NO": true
        "-presence.hideWhenFullscreenActive NO": true
        "-presence.excludeFromScreenCapture NO": true
      # Opt in with -enableCodeCoverage YES when measuring tests. Xcode also
      # instruments ordinary Release builds when the scheme enables coverage.
      gatherCoverageData: false
      targets:
        - ArrasTests
        - ArrasUITests

  ArrasAppStore:
    build:
      targets:
        ArrasAppStore: all
        ArrasAppStoreTests: [test]
        ArrasAppStoreUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      environmentVariables:
        ARRAS_UNIT_TESTING: "1"
      # Window fixtures must not inherit the user's live hiding preferences.
      # These command-line defaults exist only in the test host process.
      commandLineArguments:
        "-presence.autoHideForConferencingApps NO": true
        "-presence.hideWhenFullscreenActive NO": true
        "-presence.excludeFromScreenCapture NO": true
      # Opt in with -enableCodeCoverage YES when measuring tests. Xcode also
      # instruments ordinary Release builds when the scheme enables coverage.
      gatherCoverageData: false
      targets:
        - ArrasAppStoreTests
        - ArrasAppStoreUITests
